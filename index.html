<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="體態記錄">
<title>體態記錄</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#ffffff;--text:#1c1c1e;--text2:#6e6e73;--border:rgba(0,0,0,0.1);--accent:#178CBA;--green:#1D9E75;--orange:#D85A30;--input-bg:#f2f2f7;--tab-bg:#e5e5ea;--tab-active:#ffffff}
@media(prefers-color-scheme:dark){:root{--bg:#000000;--card:#1c1c1e;--text:#ffffff;--text2:#8e8e93;--border:rgba(255,255,255,0.1);--input-bg:#2c2c2e;--tab-bg:#2c2c2e;--tab-active:#3a3a3c}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.top-bar{background:var(--card);border-bottom:0.5px solid var(--border);padding:16px 20px 12px;position:sticky;top:0;z-index:10}
.top-bar h1{font-size:22px;font-weight:600}
.top-bar .date-label{font-size:13px;color:var(--text2);margin-top:2px}
.tab-bar{display:flex;gap:4px;padding:4px;background:var(--tab-bg);border-radius:12px;margin:16px 16px 0}
.tab{flex:1;padding:8px 4px;font-size:13px;font-weight:500;text-align:center;border:none;background:transparent;color:var(--text2);border-radius:9px;cursor:pointer;transition:all .2s}
.tab.active{background:var(--tab-active);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.section{display:none;padding:16px}.section.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;color:var(--text2);font-weight:500;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row{margin-bottom:10px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
input[type=number],input[type=text],textarea,select{width:100%;padding:10px 12px;font-size:16px;border:none;border-radius:10px;background:var(--input-bg);color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none}
textarea{min-height:72px;resize:none;line-height:1.5}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--accent)}
.btn-primary{width:100%;padding:14px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;margin-top:4px}
.btn-primary:active{opacity:0.85;transform:scale(0.99)}
.btn-secondary{padding:8px 16px;font-size:13px;font-weight:500;background:var(--input-bg);color:var(--text);border:none;border-radius:10px;cursor:pointer}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric-card{background:var(--input-bg);border-radius:12px;padding:12px 14px}
.metric-label{font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.metric-value{font-size:24px;font-weight:600}
.metric-unit{font-size:13px;color:var(--text2);font-weight:400}
.metric-diff{font-size:12px;margin-top:3px}
.diff-down{color:var(--green)}.diff-up{color:var(--orange)}.diff-zero{color:var(--text2)}
.chart-selector{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chart-btn{padding:6px 12px;font-size:13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-weight:500}
.chart-btn.active{background:var(--accent);color:#fff;border-color:transparent}
.chart-wrap{position:relative;width:100%;height:220px}
.log-item{border-bottom:0.5px solid var(--border);padding:12px 0}
.log-item:last-child{border-bottom:none}
.log-date{font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500}
.log-values{font-size:14px;display:flex;gap:12px;flex-wrap:wrap}
.log-note{font-size:13px;color:var(--text2);margin-top:5px;font-style:italic}
.goal-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border)}
.goal-row:last-child{border-bottom:none}
.goal-label{font-size:14px;font-weight:500}
.goal-sub{font-size:12px;color:var(--text2);margin-top:2px}
.goal-val{font-size:14px;font-weight:600;text-align:right}
.progress-bar{height:5px;background:var(--input-bg);border-radius:3px;margin-top:6px;overflow:hidden;width:160px}
.progress-fill{height:100%;border-radius:3px;background:var(--green)}
.progress-fill.danger{background:var(--orange)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;font-weight:600}
.badge-good{background:#E1F5EE;color:#0F6E56}.badge-warn{background:#FAEEDA;color:#854F0B}
.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:15px}
.export-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.export-row span{font-size:17px;font-weight:600}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:all .3s;z-index:100;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="top-bar">
  <h1>體態記錄</h1>
  <div class="date-label" id="todayLabel"></div>
</div>
<div class="tab-bar">
  <button class="tab active" onclick="switchTab('record')">記錄</button>
  <button class="tab" onclick="switchTab('trend')">趨勢</button>
  <button class="tab" onclick="switchTab('history')">歷史</button>
  <button class="tab" onclick="switchTab('goal')">目標</button>
</div>
<div class="section active" id="sec-record">
  <div class="card">
    <div class="card-title">今日數據</div>
    <div class="grid2">
      <div class="form-row"><label class="form-label">體重（kg）</label><input type="number" id="inp-weight" step="0.1" inputmode="decimal" placeholder="例：65.5"></div>
      <div class="form-row"><label class="form-label">體脂率（%）</label><input type="number" id="inp-fat" step="0.1" inputmode="decimal" placeholder="例：22.0"></div>
      <div class="form-row"><label class="form-label">BMI</label><input type="number" id="inp-bmi" step="0.1" inputmode="decimal" placeholder="例：22.5"></div>
      <div class="form-row"><label class="form-label">內臟脂肪</label><input type="number" id="inp-visceral" step="1" inputmode="numeric" placeholder="例：8"></div>
    </div>
    <div class="form-row"><label class="form-label">備註（飲食、運動、狀況）</label><textarea id="inp-note" placeholder="今天走了30分鐘，飲食清淡..."></textarea></div>
    <button class="btn-primary" onclick="saveRecord()">儲存今日記錄</button>
  </div>
  <div id="today-summary"></div>
</div>
<div class="section" id="sec-trend">
  <div class="card">
    <div class="chart-selector">
      <button class="chart-btn active" onclick="selectChart('weight',this)">體重</button>
      <button class="chart-btn" onclick="selectChart('fat',this)">體脂率</button>
      <button class="chart-btn" onclick="selectChart('bmi',this)">BMI</button>
      <button class="chart-btn" onclick="selectChart('visceral',this)">內臟脂肪</button>
    </div>
    <div class="chart-wrap"><canvas id="trendChart" role="img" aria-label="體態趨勢折線圖">體態趨勢圖表</canvas></div>
  </div>
  <div class="metric-grid" id="statsGrid"></div>
</div>
<div class="section" id="sec-history">
  <div class="export-row">
    <span>所有記錄</span>
    <button class="btn-secondary" onclick="exportCSV()">匯出 CSV</button>
  </div>
  <div class="card" id="historyList"></div>
</div>
<div class="section" id="sec-goal">
  <div class="card">
    <div class="card-title">設定目標</div>
    <div class="grid2">
      <div class="form-row"><label class="form-label">目標體重（kg）</label><input type="number" id="goal-weight" step="0.1" inputmode="decimal" placeholder="例：60.0"></div>
      <div class="form-row"><label class="form-label">目標體脂率（%）</label><input type="number" id="goal-fat" step="0.1" inputmode="decimal" placeholder="例：18.0"></div>
      <div class="form-row"><label class="form-label">目標內臟脂肪</label><input type="number" id="goal-visceral" step="1" inputmode="numeric" placeholder="例：5"></div>
    </div>
    <button class="btn-primary" onclick="saveGoals()">儲存目標</button>
  </div>
  <div class="card" id="goalProgress"></div>
</div>
<div class="toast" id="toast"></div>
<script>
let records=JSON.parse(localStorage.getItem('bodyRecords')||'[]');
let goals=JSON.parse(localStorage.getItem('bodyGoals')||'{}');
let currentChart='weight';
let chartInstance=null;
const keys={weight:'體重',fat:'體脂率',bmi:'BMI',visceral:'內臟脂肪'};
const units={weight:'kg',fat:'%',bmi:'',visceral:''};
const colors={weight:'#178CBA',fat:'#D85A30',bmi:'#7F77DD',visceral:'#1D9E75'};
function today(){return new Date().toISOString().slice(0,10)}
document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function switchTab(name){const names=['record','trend','history','goal'];document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',names[i]===name));document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec-'+name).classList.add('active');if(name==='trend')renderTrend();if(name==='history')renderHistory();if(name==='goal')renderGoals()}
function saveRecord(){const w=parseFloat(document.getElementById('inp-weight').value);const f=parseFloat(document.getElementById('inp-fat').value);const b=parseFloat(document.getElementById('inp-bmi').value);const v=parseFloat(document.getElementById('inp-visceral').value);const note=document.getElementById('inp-note').value.trim();if(isNaN(w)&&isNaN(f)&&isNaN(b)&&isNaN(v)){showToast('請至少輸入一項數值');return}const d=today();const idx=records.findIndex(r=>r.date===d);const rec={date:d,weight:isNaN(w)?null:w,fat:isNaN(f)?null:f,bmi:isNaN(b)?null:b,visceral:isNaN(v)?null:v,note};if(idx>=0)records[idx]=rec;else records.push(rec);records.sort((a,b)=>a.date.localeCompare(b.date));localStorage.setItem('bodyRecords',JSON.stringify(records));['weight','fat','bmi','visceral','note'].forEach(k=>document.getElementById('inp-'+k).value='');renderTodaySummary();showToast('✓ 記錄已儲存')}
function renderTodaySummary(){const d=today();const rec=records.find(r=>r.date===d);const el=document.getElementById('today-summary');if(!rec){el.innerHTML='';return}el.innerHTML=`<div class="card"><div class="card-title">今日已記錄</div><div class="metric-grid">${['weight','fat','bmi','visceral'].filter(k=>rec[k]!=null).map(k=>`<div class="metric-card"><div class="metric-label">${keys[k]}</div><div class="metric-value">${rec[k]}<span class="metric-unit"> ${units[k]}</span></div></div>`).join('')}</div>${rec.note?`<div style="font-size:13px;color:var(--text2);font-style:italic;margin-top:4px">${rec.note}</div>`:''}</div>`}
function selectChart(key,btn){currentChart=key;document.querySelectorAll('.chart-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTrend()}
function renderTrend(){const data=records.filter(r=>r[currentChart]!=null);if(data.length===0){if(chartInstance){chartInstance.destroy();chartInstance=null}document.getElementById('statsGrid').innerHTML=`<div class="empty" style="grid-column:span 2">尚無${keys[currentChart]}數據</div>`;return}const labels=data.map(r=>r.date.slice(5));const vals=data.map(r=>r[currentChart]);const col=colors[currentChart];const isDark=matchMedia('(prefers-color-scheme: dark)').matches;const gridColor=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';const tickColor=isDark?'#8e8e93':'#6e6e73';if(chartInstance)chartInstance.destroy();chartInstance=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels,datasets:[{label:keys[currentChart],data:vals,borderColor:col,backgroundColor:col+'22',fill:true,tension:0.35,pointRadius:4,pointBackgroundColor:col,pointBorderColor:'#fff',pointBorderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed.y} ${units[currentChart]}`}}},scales:{x:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:11},maxTicksLimit:7}},y:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:11}}}}}})}
function renderStats(vals,data){const latest=vals[vals.length-1];const first=vals[0];const min=Math.min(...vals);const max=Math.max(...vals);const diff=(latest-first).toFixed(1);const diffStr=diff>0?`+${diff}`:diff;const isGoodDown=['fat','visceral','weight'].includes(currentChart);const diffCls=parseFloat(diff)===0?'diff-zero':(parseFloat(diff)<0?(isGoodDown?'diff-down':'diff-up'):(isGoodDown?'diff-up':'diff-down'));document.getElementById('statsGrid').innerHTML=`<div class="metric-card"><div class="metric-label">最新值</div><div class="metric-value">${latest}<span class="metric-unit"> ${units[currentChart]}</span></div><div class="metric-diff ${diffCls}">相較起始 ${diffStr}</div></div><div class="metric-card"><div class="metric-label">記錄天數</div><div class="metric-value">${data.length}<span class="metric-unit"> 天</span></div></div><div class="metric-card"><div class="metric-label">最低值</div><div class="metric-value">${min}<span class="metric-unit"> ${units[currentChart]}</span></div></div><div class="metric-card"><div class="metric-label">最高值</div><div class="metric-value">${max}<span class="metric-unit"> ${units[currentChart]}</span></div></div>`}
function renderHistory(){const el=document.getElementById('historyList');if(records.length===0){el.innerHTML=`<div class="empty">尚無記錄<br><span style="font-size:13px">去「記錄」頁面新增第一筆！</span></div>`;return}el.innerHTML=[...records].reverse().map(r=>`<div class="log-item"><div class="log-date">${r.date}</div><div class="log-values">${r.weight!=null?`<span>體重 <b>${r.weight}</b>kg</span>`:''} ${r.fat!=null?`<span>體脂 <b>${r.fat}</b>%</span>`:''} ${r.bmi!=null?`<span>BMI <b>${r.bmi}</b></span>`:''} ${r.visceral!=null?`<span>內臟 <b>${r.visceral}</b></span>`:''}</div>${r.note?`<div class="log-note">${r.note}</div>`:''}</div>`).join('')}
function saveGoals(){goals.weight=parseFloat(document.getElementById('goal-weight').value)||null;goals.fat=parseFloat(document.getElementById('goal-fat').value)||null;goals.visceral=parseFloat(document.getElementById('goal-visceral').value)||null;localStorage.setItem('bodyGoals',JSON.stringify(goals));renderGoals();showToast('✓ 目標已儲存')}
function renderGoals(){if(goals.weight)document.getElementById('goal-weight').value=goals.weight;if(goals.fat)document.getElementById('goal-fat').value=goals.fat;if(goals.visceral)document.getElementById('goal-visceral').value=goals.visceral;const latest=records[records.length-1];const el=document.getElementById('goalProgress');if(!latest){el.innerHTML=`<div class="empty">尚無記錄，無法顯示進度</div>`;return}const rows=[{key:'weight',label:'體重',unit:'kg'},{key:'fat',label:'體脂率',unit:'%'},{key:'visceral',label:'內臟脂肪',unit:''}].filter(r=>goals[r.key]&&latest[r.key]!=null);if(rows.length===0){el.innerHTML=`<div class="empty">請先設定目標</div>`;return}el.innerHTML=`<div class="card-title">目標進度</div>`+rows.map(r=>{const cur=latest[r.key],goal=goals[r.key];const startRec=records.find(x=>x[r.key]!=null);const start=startRec?startRec[r.key]:cur;const total=Math.abs(start-goal)||1;const done=Math.abs(cur-goal);const pct=Math.min(100,Math.round((1-done/total)*100));const reached=cur<=goal;return`<div class="goal-row"><div><div class="goal-label">${r.label}</div><div class="goal-sub">目前 ${cur}${r.unit} → 目標 ${goal}${r.unit}</div><div class="progress-bar"><div class="progress-fill${reached?'':' danger'}" style="width:${pct}%"></div></div></div><div class="goal-val">${pct}%${reached?'<span class="badge badge-good">達標</span>':'<span class="badge badge-warn">加油</span>'}</div></div>`}).join('')}
function exportCSV(){if(records.length===0){showToast('尚無記錄可匯出');return}const header='日期,體重(kg),體脂率(%),BMI,內臟脂肪,備註';const rows=records.map(r=>[r.date,r.weight??'',r.fat??'',r.bmi??'',r.visceral??'',`"${(r.note||'').replace(/"/g,'""')}"`].join(','));const csv='\uFEFF'+[header,...rows].join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`體態記錄_${today()}.csv`;a.click();showToast('✓ CSV 已匯出')}
renderTodaySummary();
</script>
</body>
</html>
